<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>لوحة مشرف المنصة</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
<style>
:root{--g:#0b6b33;--gd:#064d24;--bg:#eceff3;--c:#fff;--t:#1d2733;--m:#6b7785;--b:#dde3ea;--r:#c0392b;--o:#d98a00;--bl:#2b7fb8;--side:#3c4e5e;--side2:#2f3e4b;--sidet:#dbe4ec;
 --k1:#e8705f;--k2:#4a9db8;--k3:#d9a62e;--k4:#3cb58a}
@media(prefers-color-scheme:dark){:root{--bg:#121820;--c:#1b2430;--t:#e6edf4;--m:#97a5b4;--b:#2b3744;--side:#1a232d;--side2:#141b23}}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--t);font-size:15px}
button,input,select{font:inherit;color:inherit}
.hide{display:none!important}
#login{min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(160deg,var(--side2),var(--side))}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:18px;box-shadow:0 1px 2px rgba(20,30,40,.05)}
#login .card{width:100%;max-width:380px}
h1{font-size:19px;margin:0 0 4px}h2{font-size:15px;margin:0 0 10px}
.sub{color:var(--m);font-size:13px;margin:0 0 14px}
label{display:block;font-size:13px;color:var(--m);margin:10px 0 4px}
input,select{width:100%;padding:11px 12px;border:1px solid var(--b);border-radius:10px;background:var(--c);min-height:44px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--g);outline-offset:1px}
.ltr{direction:ltr;text-align:left}
.btn{border:0;border-radius:10px;padding:10px 14px;min-height:44px;background:var(--g);color:#fff;cursor:pointer;font-weight:600}
.btn.sec{background:transparent;color:var(--t);border:1px solid var(--b)}
.btn.red{background:var(--r)}.btn.org{background:var(--o)}.btn.blue{background:var(--bl)}
.btn:disabled{opacity:.5}.btn.full{width:100%;margin-top:14px}
.err{color:var(--r);font-size:13px;margin-top:10px;min-height:18px}
/* التخطيط: قائمة جانبية + محتوى */
#app{display:flex;min-height:100vh}
#side{width:248px;flex:none;background:var(--side);color:var(--sidet);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:30}
.brand{padding:16px 16px 14px;font-weight:800;font-size:16px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;gap:10px;align-items:center}
.brand i{width:34px;height:34px;border-radius:9px;background:var(--g);display:grid;place-items:center;font-style:normal;color:#fff;font-size:17px}
.brand small{display:block;font-weight:500;font-size:11px;opacity:.7}
#nav{padding:10px 8px;flex:1;overflow:auto}
#nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:transparent;border:0;border-radius:8px;padding:12px 14px;margin-bottom:2px;color:var(--sidet);cursor:pointer;font-size:14px;min-height:46px;position:relative}
#nav button svg{width:19px;height:19px;flex:none;opacity:.85}
#nav button:hover{background:rgba(255,255,255,.07)}
#nav button.on{background:var(--side2);color:#fff;font-weight:700}
#nav button.on::before{content:"";position:absolute;inset-inline-start:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--k4)}
.sfoot{padding:12px;border-top:1px solid rgba(255,255,255,.08);font-size:12px}
.sfoot .em{direction:ltr;text-align:left;opacity:.8;word-break:break-all;margin-bottom:8px}
.sfoot button{width:100%;background:rgba(255,255,255,.1);border:0;border-radius:8px;color:#fff;padding:10px;cursor:pointer;min-height:40px}
#shade{display:none}
.wrap{flex:1;min-width:0}
header{position:sticky;top:0;z-index:10;background:var(--c);border-bottom:1px solid var(--b);padding:10px 16px;display:flex;align-items:center;gap:12px}
header .ttl{flex:1;min-width:0}header .ttl b{display:block;font-size:17px}header .ttl small{color:var(--m);font-size:12px}
#burger{display:none;background:transparent;border:1px solid var(--b);border-radius:9px;width:42px;height:42px;cursor:pointer}
#gs{max-width:300px}
main{padding:16px;max-width:1300px;margin:0 auto}
.kcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:14px}
.kc{border-radius:12px;padding:16px;color:#fff;position:relative;overflow:hidden;min-height:112px}
.kc .n{font-size:32px;font-weight:800;direction:ltr;text-align:right;line-height:1.1;padding-inline-end:70px}
.kc .l{font-size:14px;font-weight:600;margin-top:2px}
.kc .d{font-size:12px;margin-top:10px;opacity:.95;display:flex;gap:6px;align-items:center}
.kc svg.bg{position:absolute;inset-inline-end:12px;top:14px;width:58px;height:58px;opacity:.22}
.k1{background:var(--k1)}.k2{background:var(--k2)}.k3{background:var(--k3)}.k4{background:var(--k4)}
.two{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:14px}
.panel{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;min-width:0}
.panel h2{display:flex;justify-content:space-between;align-items:center}
.panel.blue{background:var(--k2);color:#fff;border-color:transparent}
.chart{width:100%;height:auto;display:block}
.chart text{font-size:10px;fill:var(--m)}.panel.blue .chart text{fill:#e6f3f8}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;font-size:12px}.mini b{display:block;font-size:17px;direction:ltr;text-align:right}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px}
.kpi .n{font-size:24px;font-weight:700;direction:ltr;text-align:right}.kpi .l{font-size:12px;color:var(--m)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.bar input{flex:1;min-width:180px}.bar select{width:auto;min-width:130px}
.row{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer}
.row:hover{border-color:var(--k4)}
.row .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.row .mail{font-weight:600;direction:ltr;text-align:left;word-break:break-all}
.meta{font-size:12px;color:var(--m);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 12px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--b);margin-inline-start:4px;white-space:nowrap}
.tag.g{background:#d7efe0;color:#0b5a2b}.tag.r{background:#f7d9d5;color:#9b2c20}.tag.o{background:#fbe8c4;color:#8a5a00}.tag.b{background:#d6e8f7;color:#124a7a}
@media(prefers-color-scheme:dark){.tag.g{background:#1d4a2e;color:#b9ebcb}.tag.r{background:#5a2420;color:#f6c8c2}.tag.o{background:#55420f;color:#f5dca0}.tag.b{background:#173d5c;color:#c0dcf3}}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:820px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px}
@media(min-width:800px){.sheet-bg{align-items:center}.sheet{border-radius:18px}}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}dt{color:var(--m)}dd{margin:0;word-break:break-word}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.sec{margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:right;padding:8px;border-bottom:1px solid var(--b)}
th{color:var(--m);font-weight:600;background:rgba(127,140,155,.07)}
.tw{overflow-x:auto}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;z-index:80;max-width:90%}
.empty{text-align:center;color:var(--m);padding:30px}

.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}.tools input{flex:1;min-width:200px}.tools select{width:auto;min-width:140px}
.rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.item{display:flex;gap:12px;align-items:center;background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;cursor:pointer;box-shadow:0 1px 2px rgba(20,30,40,.04)}
.item:hover{border-color:var(--k4);box-shadow:0 2px 8px rgba(20,30,40,.08)}
.av{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px}
.item .bd{flex:1;min-width:0}.item .mail{font-weight:700;direction:ltr;text-align:left;word-break:break-all;font-size:14px}
.item .big{text-align:center;flex:none;min-width:48px}.item .big b{display:block;font-size:22px;direction:ltr}.item .big small{color:var(--m);font-size:11px}
.item{flex-wrap:wrap}.ctl{flex-basis:100%;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px dashed var(--b);padding-top:10px;margin-top:2px;cursor:default}
.ctl .cd{font-weight:800;font-size:12px;padding:3px 10px;border-radius:12px;white-space:nowrap}
.cd.g{background:#d7efe0;color:#0b5a2b}.cd.o{background:#fbe8c4;color:#8a5a00}.cd.r{background:#f7d9d5;color:#9b2c20}.cd.n{background:var(--b);color:var(--m)}
.ctl .sw{display:inline-flex;align-items:center;gap:6px;font-size:12px;margin:0;color:var(--t);cursor:pointer}
.ctl .sw input{appearance:none;-webkit-appearance:none;width:38px;height:22px;min-height:0;padding:0;border-radius:12px;background:#b8c2cc;position:relative;cursor:pointer;border:0;flex:none}
.ctl .sw input::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:inset-inline-start .15s}
.ctl .sw input:checked{background:var(--r)}.ctl .sw input:checked::after{inset-inline-start:18px}
.ctl input[type=date]{width:auto;min-height:36px;padding:4px 8px;font-size:12px}
.ctl .mb{min-height:34px;padding:4px 10px;font-size:12px}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:14px}
.howto div{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;font-size:13px;line-height:1.7}
.howto b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--k4);color:#fff;margin-inline-end:6px;font-size:13px}
.plan{border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--bg)}
.plan .f{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}.plan .f.two{grid-template-columns:1fr;margin-top:6px}
.plan label{margin:0 0 4px}.plan .hint{font-size:12px;color:var(--m);margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pv{max-width:400px;margin:0 auto;background:#fff;color:#16221a;border-radius:20px;padding:20px;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.12)}
.pv .pc{display:block;width:100%;text-align:right;border:2px solid #0b6b33;border-radius:14px;background:#fff;padding:12px 14px;margin-top:10px;position:relative}
.pv .pc .row1{display:flex;justify-content:space-between;align-items:baseline;font-weight:800}.pv .pc small{color:#667;display:block;font-size:12px;margin-top:2px}
.pv .pc .bdg{position:absolute;top:-10px;inset-inline-start:12px;background:#0b6b33;color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:1px 8px}
@media(max-width:700px){.plan .f{grid-template-columns:1fr}}
@media(max-width:900px){
 #side{position:fixed;top:0;bottom:0;inset-inline-start:0;transform:translateX(100%);transition:transform .2s}
 html[dir=rtl] #side{transform:translateX(100%)}
 #app.open #side{transform:none}
 #app.open #shade{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25}
 #burger{display:block}.two{grid-template-columns:1fr}#gs{display:none}
 main{padding:12px}
}
@media(prefers-reduced-motion:reduce){#side{transition:none}}
</style>
</head>
<body>
<div id="login">
 <form class="card" id="lf" autocomplete="on">
  <h1>لوحة مشرف المنصة</h1>
  <p class="sub">دخول مخصّص لمشرفي المنصة فقط</p>
  <label for="em">البريد الإلكتروني</label>
  <input id="em" type="email" class="ltr" inputmode="email" autocomplete="username" required>
  <label for="pw">كلمة المرور</label>
  <input id="pw" type="password" class="ltr" autocomplete="current-password" required>
  <button class="btn full" id="lb" type="submit">دخول</button>
  <div class="err" id="le"></div>
 </form>
</div>
<div id="app" class="hide">
 <aside id="side"><div class="brand"><i>س</i><div>منصة سعودي HR<small>لوحة مشرف المنصة</small></div></div><nav id="nav" aria-label="القائمة الرئيسية"></nav><div class="sfoot"><div class="em" id="me"></div><button id="out">تسجيل الخروج</button></div></aside>
 <div id="shade"></div>
 <div class="wrap"><header><button id="burger" aria-label="القائمة">☰</button><div class="ttl"><b id="ptitle"></b><small id="pcrumb"></small></div><input id="gs" type="search" placeholder="بحث سريع عن حساب أو منشأة…" aria-label="بحث"></header><main id="main"></main></div>
</div>
<div id="sh"></div>
<script>
const SB_URL='https://ejqawvzzgbwndwjcmvmi.supabase.co',SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVqcWF3dnp6Z2J3bmR3amNtdm1pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NDIxNTgsImV4cCI6MjEwNDUxODE1OH0.kg9Pzdp4-av5OywKfYY20JoOAHc46y7fO2TdUPFwNVo';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd=d=>d?new Date(d).toLocaleString('en-GB',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const fday=d=>d?new Date(d).toLocaleDateString('en-GB'):'—';
const ACT={education:'تعليم',academy:'أكاديمية',commerce:'تجاري'};
const LBL={view_company:'عرض منشأة',view_employees:'عرض موظفي منشأة',ban_user:'إيقاف حساب',unban_user:'تفعيل حساب',confirm_email:'تأكيد بريد',extend_trial:'تمديد تجربة',convert_to_full:'تحويل لمنشأة فعلية',delete_account:'حذف حساب',send_password_reset:'إرسال رابط كلمة مرور',set_subscription:'ضبط الاشتراك/القفل',lock_company:'قفل يدوي',unlock_company:'فتح الدخول',set_until:'تحديد تاريخ الإيقاف',manual_payment:'تسجيل سداد يدوي',set_billing:'تعديل الباقات',view_data:'اطلاع على بيانات منشأة',reveal_sensitive:'اطلاع على بيانات حساسة',view_settings:'اطلاع على إعدادات منشأة'};
let ACCS=[],tab='ov',filt='all',q='',IDLE=null;
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
async function rpc(n,a){const{data,error}=await sb.rpc(n,a||{});if(error)throw new Error(error.message);return data}
function idle(){clearTimeout(IDLE);IDLE=setTimeout(()=>logout('انتهت الجلسة لعدم النشاط'),30*60*1000)}
['click','keydown','touchstart'].forEach(e=>document.addEventListener(e,()=>{if(!$('app').classList.contains('hide'))idle()},{passive:true}));
async function logout(msg){await sb.auth.signOut();if(!msg){location.replace('/');return}$('app').classList.add('hide');$('login').classList.remove('hide');$('sh').innerHTML='';$('le').textContent=msg||'';$('pw').value=''}
$('out').onclick=()=>logout();
$('lf').onsubmit=async e=>{e.preventDefault();$('le').textContent='';$('lb').disabled=true;
 try{const{error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
  if(error)throw new Error('بيانات الدخول غير صحيحة');
  const w=await rpc('admin_whoami');
  if(!w||!w.is_admin){await sb.auth.signOut();throw new Error('هذا الحساب غير مصرّح له بدخول لوحة المشرف')}
  $('me').textContent=w.email;$('login').classList.add('hide');$('app').classList.remove('hide');idle();await boot();
 }catch(x){$('le').textContent=x.message}finally{$('lb').disabled=false}};
const IC={ov:'<path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>',ac:'<path d="M16 11c1.7 0 3-1.3 3-3s-1.3-3-3-3-3 1.3-3 3 1.3 3 3 3zM8 11c1.7 0 3-1.3 3-3S9.7 5 8 5 5 6.300 5 8s1.3 3 3 3zm0 2c-2.300 0-7 1.200-7 3.500V19h14v-2.500C15 14.200 10.300 13 8 13zm8 0c-.3 0-.6 0-1 .1 1.200.8 2 1.900 2 3.400V19h6v-2.500c0-2.300-4.700-3.500-7-3.500z"/>',co:'<path d="M12 7V3H2v18h20V7H12zM6 19H4v-2h2v2zm0-4H4v-2h2v2zm0-4H4V9h2v2zm0-4H4V5h2v2zm4 12H8v-2h2v2zm0-4H8v-2h2v2zm0-4H8V9h2v2zm0-4H8V5h2v2zm10 12h-8v-2h2v-2h-2v-2h2v-2h-2V9h8v10z"/>',bl:'<path d="M20 4H4c-1.100 0-2 .9-2 2v12c0 1.100.9 2 2 2h16c1.100 0 2-.9 2-2V6c0-1.100-.9-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/>',lg:'<path d="M13 3a9 9 0 0 0-9 9H1l3.900 3.900.1.1L9 12H6a7 7 0 1 1 2.100 5l-1.400 1.400A9 9 0 1 0 13 3zm-1 5v5l4.300 2.500.8-1.300-3.600-2.100V8H12z"/>'};
const TABS=[['ov','نظرة عامة'],['ac','الحسابات'],['co','المنشآت'],['bl','الاشتراكات والسداد'],['lg','سجل التدقيق']];
function nav(){$('nav').innerHTML=TABS.map(([k,l])=>`<button class="${tab===k?'on':''}" data-k="${k}"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${IC[k]}</svg><span>${l}</span></button>`).join('');
 $('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.k;$('app').classList.remove('open');render()});
 const t=TABS.find(x=>x[0]===tab);$('ptitle').textContent=t?t[1]:'';$('pcrumb').textContent='لوحة المشرف / '+(t?t[1]:'')}
$('burger').onclick=()=>$('app').classList.toggle('open');$('shade').onclick=()=>$('app').classList.remove('open');
$('gs').onkeydown=e=>{if(e.key==='Enter'){q=e.target.value.trim();filt='all';tab='ac';e.target.value='';render()}};
async function boot(){try{ACCS=await rpc('admin_accounts')}catch(e){toast(e.message)}render()}
async function render(){nav();const m=$('main');m.innerHTML='<div class="empty">جاري التحميل…</div>';
 try{if(tab==='ov')await vOv(m);else if(tab==='ac')vAc(m);else if(tab==='co')vCo(m);else if(tab==='bl')await vBl(m);else await vLg(m)}catch(e){m.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
function chart(vals,labels,o){o=o||{};const W=600,H=o.h||200,P=28,n=vals.length,mx=Math.max(1,...vals),X=i=>P+(n>1?i*(W-P-8)/(n-1):0),Y=v=>H-22-(v/mx)*(H-42);
 const pts=vals.map((v,i)=>[X(i),Y(v)]);const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');

 sheet(`${hd(esc(c.name_ar))}<div class="card"><dl><dt>الاسم (إنجليزي)</dt><dd class="ltr"><bdi>${esc(c.name_en||'—')}</bdi></dd><dt>الرقم الموحّد</dt><dd class="ltr"><bdi>${esc(c.cr_number||'—')}</bdi></dd><dt>المالك</dt><dd class="ltr"><bdi>${esc(c.owner_email)}</bdi></dd><dt>النشاط</dt><dd>${esc(ACT[c.activity]||c.activity||'—')}</dd><dt>النوع</dt><dd>${c.is_trial?`<span class="tag o">تجريبية</span> تنتهي ${fday(c.trial_ends_at)}`:'<span class="tag g">فعلية</span>'}</dd><dt>أُنشئت</dt><dd>${fd(c.created_at)}</dd><dt>آخر تعديل</dt><dd>${fd(c.updated_at)}</dd><dt>الشعار / الختم / الورق الرسمي</dt><dd>${c.has_logo?'✓':'✗'} / ${c.has_stamp?'✓':'✗'} / ${c.has_letterhead?'✓':'✗'}</dd></dl>
 <div class="acts">${c.is_trial?'<button class="btn org" id="t1">تمديد التجربة</button><button class="btn" id="t2">تحويل إلى منشأة فعلية</button>':''}<button class="btn blue" id="t3">عرض الموظفين (يُسجَّل)</button></div></div>
 <div class="sec"><h2>البيانات المرتبطة</h2><div class="grid">${Object.keys(CL).map(k=>`<div class="kpi"><div class="n">${esc(n[k])}</div><div class="l">${CL[k]}</div></div>`).join('')}</div></div>
 <div class="sec card"><h2>الأعضاء</h2><div class="tw"><table><tbody>${d.members.map(x=>`<tr><td><bdi>${esc(x.email)}</bdi></td><td>${esc(x.role)}</td><td>${x.joined?'منضمّ':'مدعو'}</td></tr>`).join('')||'<tr><td>لا أعضاء</td></tr>'}</tbody></table></div></div>
 <div class="sec card"><h2>الأقسام</h2>${d.departments.map(x=>`<span class="tag">${esc(x.name)} (${esc(x.employees)})</span>`).join(' ')||'—'}</div>
 <div class="sec card"><h2>آخر الأحداث</h2><div class="tw"><table><tbody>${d.recent_audit.map(x=>`<tr><td>${fd(x.occurred_at)}</td><td>${esc(x.table_name)}</td><td>${esc(x.action)}</td></tr>`).join('')||'<tr><td>—</td></tr>'}</tbody></table></div></div>
 <div class="sec card" id="subbox"></div><div class="sec card" id="dsbox"></div><div class="sec card" id="emps"></div>`);subBox(id);dsBox(id);
 const g=k=>$('sh').querySelector('#'+k);
 if(g('t1'))g('t1').onclick=async()=>{const v=prompt('عدد أيام التمديد (1–365):','14');if(!v)return;if(await act(()=>rpc('admin_set_trial',{p_company:id,p_days:parseInt(v,10)}),'تم التمديد'))coSheet(id)};
 if(g('t2'))g('t2').onclick=async()=>{if(!confirm('تحويل المنشأة إلى فعلية وإلغاء حدود التجربة؟'))return;if(await act(()=>rpc('admin_convert_company',{p_company:id}),'تم التحويل'))coSheet(id)};
 g('t3').onclick=async()=>{try{const r=await rpc('admin_company_employees',{p_company:id});g('emps').innerHTML=`<h2>الموظفون (${r.length})</h2><div class="tw"><table><thead><tr><th>الاسم</th><th>المسمى</th><th>رقم</th><th>الهوية</th><th>الحالة</th></tr></thead><tbody>${r.map(e=>`<tr><td>${esc(e.name)}</td><td>${esc(e.job_title||'—')}</td><td>${esc(e.emp_number||'—')}</td><td class="ltr"><bdi>${esc(e.nid_masked||'—')}</bdi></td><td>${e.terminated?'مخالصة':e.archived?'مؤرشف':'على رأس العمل'}</td></tr>`).join('')||'<tr><td colspan=5>لا موظفين</td></tr>'}</tbody></table></div><div class="sub">الرواتب وبيانات البنك غير معروضة عمداً.</div>`}catch(e){toast(e.message)}}
 }catch(e){sheet(hd('المنشأة')+`<div class="empty">${esc(e.message)}</div>`)}}

function csvOf(rows){const keys=[...new Set(rows.flatMap(r=>Object.keys(r)))];const q=v=>{let t=v==null?'':(typeof v==='object'?JSON.stringify(v):String(v));if(/^[=+\-@]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"'};return '﻿'+[keys.map(q).join(','),...rows.map(r=>keys.map(k=>q(r[k])).join(','))].join('\n')}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type||'text/csv'}));a.download=name;a.click()}
async function subBox(id){const box=$('sh').querySelector('#subbox');if(!box)return;
 try{const d=await rpc('admin_subscription_get',{p_company:id});const s=d.sub||{};const until=s.access_until?String(s.access_until).slice(0,10):'';
 box.innerHTML=`<h2>الاشتراك وتاريخ إيقاف الدخول</h2><dl><dt>حالة الدخول الآن</dt><dd>${d.locked_now?'<span class="tag r">مقفل</span>':'<span class="tag g">مفتوح</span>'}</dd><dt>آخر تعديل</dt><dd>${fd(s.updated_at)}</dd></dl>
 <label>تاريخ إيقاف الدخول تلقائياً (فارغ = بلا حد)</label><input type="date" id="s-until" class="ltr" value="${esc(until)}">
 <label>مهلة سماح بعد التاريخ (أيام)</label><input type="number" id="s-grace" class="ltr" min="0" max="90" value="${esc(s.grace_days||0)}">
 <label>الرسالة التي تظهر للعميل عند القفل</label><input id="s-reason" value="${esc(s.lock_reason||'')}" placeholder="مثال: بانتظار سداد الاشتراك">
 <label style="display:flex;gap:8px;align-items:center;color:var(--t)"><input type="checkbox" id="s-lock" style="width:auto;min-height:0" ${s.locked?'checked':''}> قفل يدوي فوري حتى السداد</label>
 <div class="acts"><button class="btn" id="s-save">حفظ</button><button class="btn blue" id="s-30">تمديد 30 يوماً وفتح الدخول</button><button class="btn org" id="s-pay">تسجيل سداد يدوي</button></div>
 <div class="sec"><b>سجل المدفوعات</b><div class="tw"><table><thead><tr><th>التاريخ</th><th>الباقة</th><th>المبلغ</th><th>الحالة</th></tr></thead><tbody>${d.payments.map(p=>`<tr><td>${fd(p.paid_at||p.created_at)}</td><td>${esc(p.plan||'—')} (${esc(p.months)} شهر)</td><td>${esc(p.amount)} ر.س</td><td>${esc({paid:'مدفوع',manual:'يدوي',pending:'معلّق',failed:'فشل',mismatch:'مبلغ غير مطابق'}[p.status]||p.status)}</td></tr>`).join('')||'<tr><td colspan=4>لا مدفوعات</td></tr>'}</tbody></table></div></div>`;
 const g=k=>box.querySelector('#'+k);
 const save=async(u,lk)=>{if(await act(()=>rpc('admin_subscription_set',{p_company:id,p_locked:lk,p_reason:g('s-reason').value,p_until:u,p_grace:parseInt(g('s-grace').value||'0',10),p_note:null}),'تم الحفظ')){subBox(id)}};
 g('s-save').onclick=()=>save(g('s-until').value?new Date(g('s-until').value+'T23:59:59').toISOString():null,g('s-lock').checked);
 g('s-30').onclick=()=>{const base=Math.max(Date.now(),s.access_until?new Date(s.access_until).getTime():0);save(new Date(base+30*864e5).toISOString(),false)};
 g('s-pay').onclick=async()=>{const m=prompt('عدد أشهر الاشتراك المسدَّدة (1–36):','12');if(!m)return;const a=prompt('المبلغ المسدَّد بالريال:','0');if(a===null)return;if(await act(()=>rpc('admin_record_payment',{p_company:id,p_months:parseInt(m,10),p_amount_sar:parseFloat(a)||0,p_note:'تسجيل يدوي من المشرف'}),'سُجِّل السداد وفُتح الدخول'))subBox(id)};
 }catch(e){box.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
const DS=[['employees','الموظفون'],['departments','الأقسام'],['hr_contracts','العقود'],['hr_payroll_runs','مسيّرات الرواتب'],['hr_compensation_versions','سجل الرواتب'],['employee_requests','الطلبات'],['employee_attendance','الحضور'],['hr_communications','المراسلات'],['hr_operations','العمليات'],['custody_items','العهد'],['salary_adjustments','تسويات الرواتب'],['employee_kpis','الأداء'],['hr_insurance_statements','التأمين'],['document_templates','القوالب'],['company_members','الأعضاء'],['hr_audit_events','أحداث المنشأة']];
function dsBox(id){const box=$('sh').querySelector('#dsbox');if(!box)return;
 box.innerHTML=`<h2>كل بيانات المنشأة</h2><div class="sub">كل اطلاع يُسجَّل باسمك. الموظفون يظهرون مقنَّعين؛ «إظهار الحساس» يكشف الهوية والآيبان والرواتب.</div><div class="acts" style="margin:0 0 8px">${DS.map(([k,l])=>`<button class="btn sec" data-t="${k}" style="min-height:38px;padding:6px 10px">${l}</button>`).join('')}<button class="btn sec" id="ds-set" style="min-height:38px;padding:6px 10px">إعدادات المنشأة (JSON)</button></div><div id="dsout"></div>`;
 const out=box.querySelector('#dsout');
 const load=async(t,rev)=>{out.innerHTML='<div class="empty">جاري التحميل…</div>';try{const rows=await rpc('admin_company_dataset',{p_company:id,p_table:t,p_reveal:rev});const keys=[...new Set(rows.flatMap(r=>Object.keys(r)))];
  out.innerHTML=`<div class="acts" style="margin:0 0 6px"><b>${esc(t)} — ${rows.length} صف</b>${rev?'<span class="tag r">وضع إظهار الحساس</span>':`<button class="btn org" id="ds-rev" style="min-height:36px;padding:4px 10px">إظهار الحساس</button>`}<button class="btn sec" id="ds-csv" style="min-height:36px;padding:4px 10px">تصدير CSV</button></div><div class="tw" style="max-height:50vh;overflow:auto"><table><thead><tr>${keys.map(k=>`<th>${esc(k)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${keys.map(k=>{let v=r[k];if(v&&typeof v==='object')v=JSON.stringify(v);v=v==null?'':String(v);return `<td dir="auto">${esc(v.length>80?v.slice(0,80)+'…':v)}</td>`}).join('')}</tr>`).join('')||'<tr><td>لا بيانات</td></tr>'}</tbody></table></div>`;
  const rv=out.querySelector('#ds-rev');if(rv)rv.onclick=()=>{if(confirm('سيُسجَّل اطلاعك على البيانات الحساسة باسمك ووقته. متابعة؟'))load(t,true)};
  out.querySelector('#ds-csv').onclick=()=>dl(t+'.csv',csvOf(rows))}catch(e){out.innerHTML=`<div class="empty">${esc(e.message)}</div>`;if(/الحساس/.test(e.message)&&confirm('هذا الجدول يتطلب إظهار الحساس ويُسجَّل باسمك. متابعة؟'))load(t,true)}};
 box.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>load(b.dataset.t,false));
 box.querySelector('#ds-set').onclick=async()=>{try{const r=await rpc('admin_company_settings',{p_company:id});out.innerHTML=`<div class="acts" style="margin:0 0 6px"><button class="btn sec" id="st-dl" style="min-height:36px;padding:4px 10px">تنزيل JSON</button></div><pre class="ltr" style="max-height:50vh;overflow:auto;font-size:11px;background:var(--c);border:1px solid var(--b);border-radius:10px;padding:10px;white-space:pre-wrap">${esc(JSON.stringify(r,null,2))}</pre>`;out.querySelector('#st-dl').onclick=()=>dl('settings.json',JSON.stringify(r,null,2),'application/json')}catch(e){toast(e.message)}}}
let PL=[];
const PAYST={paid:'مدفوع',manual:'يدوي',pending:'معلّق',failed:'فشل',mismatch:'مبلغ غير مطابق'};
function planCards(pl){const ok=pl.filter(p=>p.label&&p.months>0&&p.price_sar>0);const pm=p=>p.price_sar/p.months;const best=ok.length>1?ok.reduce((a,b)=>pm(b)<pm(a)?b:a):null;
 return ok.map(p=>`<div class="pc">${best&&p===best&&p.months>1?'<span class="bdg">الأكثر توفيراً</span>':''}<div class="row1"><span>${esc(p.label)}</span><span dir="ltr">${esc(p.price_sar)} SAR</span></div><small>${esc(p.months)} ${p.months===1?'شهر':'أشهر'}${p.months>1?` — ≈ <bdi>${(pm(p)).toFixed(1)}</bdi> ر.س/شهر`:''}</small>${p.desc?`<small>${esc(p.desc)}</small>`:''}</div>`).join('')||'<div style="color:#667;font-size:13px;margin-top:10px">أضف باقة واحدة على الأقل ليظهر شكلها هنا</div>'}
async function vBl(m){const b=await rpc('admin_get_billing');PL=(b.plans||[]).map(x=>({...x}));
 const draw=()=>{const okPays=b.payments.filter(p=>p.status==='paid'||p.status==='manual').length,pend=b.payments.filter(p=>p.status==='pending').length;
 m.innerHTML=`<div class="kcards" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))"><div class="kc k4"><div class="n">${esc(Number(b.revenue_paid||0).toLocaleString('en-US'))}</div><div class="l">إجمالي المحصَّل (ر.س)</div></div><div class="kc k2"><div class="n">${okPays}</div><div class="l">عمليات سداد ناجحة</div></div><div class="kc k3"><div class="n">${pend}</div><div class="l">معلّقة</div></div></div>
 <div class="howto"><div><b>1</b>أنشئ باقة: اكتب <u>اسمها</u> و<u>مدتها بالأشهر</u> و<u>سعرها بالريال</u> (أو اضغط أحد القوالب السريعة ثم اكتب السعر).</div><div><b>2</b>فعّل «السداد الإلكتروني» ثم احفظ. تظهر الباقات فوراً للمشترك عند انتهاء اشتراكه أو قفل حسابه.</div><div><b>3</b>يضغط المشترك على الباقة فيُحوَّل إلى صفحة الدفع، وبعد الدفع يُفتح حسابه تلقائياً ويُمدَّد الاشتراك بمدة الباقة.</div></div>
 <div class="two"><div class="panel"><h2><span>الباقات</span><span class="tag">${PL.length} باقة</span></h2>
 <div class="acts" style="margin:0 0 10px"><span class="sub" style="margin:0;align-self:center">إضافة سريعة:</span>${[['شهري',1],['ربع سنوي',3],['نصف سنوي',6],['سنوي',12]].map(([l,mo])=>`<button class="btn sec" data-q="${mo}|${l}" style="min-height:38px;padding:6px 12px">+ ${l}</button>`).join('')}<button class="btn sec" id="pl-add" style="min-height:38px;padding:6px 12px">+ باقة مخصّصة</button></div>
 ${PL.map((p,i)=>`<div class="plan"><div class="f"><div><label>اسم الباقة (يظهر للمشترك)</label><input data-i="${i}" data-f="label" value="${esc(p.label)}" placeholder="مثال: سنوي"></div><div><label>المدة (بالأشهر)</label><input data-i="${i}" data-f="months" class="ltr" inputmode="numeric" value="${esc(p.months)}" placeholder="12"></div><div><label>السعر (ر.س)</label><input data-i="${i}" data-f="price_sar" class="ltr" inputmode="decimal" value="${esc(p.price_sar||'')}" placeholder="0.00"></div></div><div class="f two"><div><label>وصف قصير (اختياري)</label><input data-i="${i}" data-f="desc" value="${esc(p.desc||'')}" placeholder="مثال: كل المزايا + دعم فني"></div></div><div class="hint"><span id="pm${i}"></span> <button class="btn sec" data-del="${i}" style="min-height:34px;padding:4px 10px">حذف الباقة</button></div></div>`).join('')||'<div class="empty">لا توجد باقات بعد — اضغط أحد القوالب أعلاه</div>'}
 <label style="display:flex;gap:8px;align-items:center;color:var(--t);margin-top:6px"><input type="checkbox" id="pl-en" style="width:auto;min-height:0" ${b.pay_enabled?'checked':''}> تفعيل السداد الإلكتروني للمشتركين</label>
 <div class="sub" style="margin:4px 0 0">لا يعمل السداد فعلياً قبل إضافة مفاتيح ميسر (انظر الإعداد أدناه).</div>
 <div class="acts"><button class="btn" id="pl-save">حفظ الباقات</button></div><div class="err" id="pl-err"></div></div>
 <div class="panel"><h2>معاينة: هكذا تظهر للمشترك</h2><div class="pv"><div style="font-size:34px">🔒</div><div style="font-weight:900;font-size:17px;margin:6px 0">انتهى اشتراك المنشأة</div><div style="font-size:12px;color:#667">جدّد الاشتراك لمتابعة استخدام المنصة</div><div id="pvc">${planCards(PL)}</div></div></div></div>
 <details class="panel" style="margin-bottom:14px"><summary style="cursor:pointer;font-weight:700">إعداد ربط ميسر (مرة واحدة)</summary><div class="sub" style="margin-top:10px;line-height:1.9">1) في Supabase ← Edge Functions ← Secrets أضف <b class="ltr">MOYASAR_SECRET_KEY</b> و<b class="ltr">MOYASAR_WEBHOOK_TOKEN</b> (رمز سري تختاره).<br>2) في لوحة ميسر أضف Webhook للحدث <b class="ltr">payment_paid</b> على الرابط: <bdi class="ltr" style="user-select:all">${esc(SB_URL)}/functions/v1/moyasar-webhook</bdi> بنفس الرمز السري.<br>3) جرّب بمفاتيح الاختبار أولاً، ثم بدّلها بمفاتيح الإنتاج.</div></details>
 <div class="panel tw"><h2>آخر المدفوعات</h2><table><thead><tr><th>التاريخ</th><th>المنشأة</th><th>الباقة</th><th>المبلغ</th><th>الحالة</th></tr></thead><tbody>${b.payments.map(p=>`<tr><td>${fd(p.paid_at||p.created_at)}</td><td>${esc(p.company||'—')}</td><td>${esc(p.plan_label||'—')}</td><td>${esc(p.amount)}</td><td>${esc(PAYST[p.status]||p.status)}</td></tr>`).join('')||'<tr><td colspan=5>لا مدفوعات بعد</td></tr>'}</tbody></table></div>`;
 const upd=()=>{PL.forEach((p,i)=>{const e=m.querySelector('#pm'+i);if(e)e.textContent=(p.months>0&&p.price_sar>0)?`≈ ${(p.price_sar/p.months).toFixed(2)} ر.س في الشهر`:'اكتب المدة والسعر'});const pv=m.querySelector('#pvc');if(pv)pv.innerHTML=planCards(PL)};
 upd();
 m.querySelectorAll('[data-f]').forEach(e=>e.oninput=()=>{const f=e.dataset.f,p=PL[e.dataset.i];if(f==='label'||f==='desc'){p[f]=e.value}else{const v=latin(e.value);e.value=v;p[f]=parseFloat(v)||0}upd()});
 m.querySelectorAll('[data-del]').forEach(e=>e.onclick=()=>{PL.splice(+e.dataset.del,1);draw()});
 m.querySelectorAll('[data-q]').forEach(e=>e.onclick=()=>{const[mo,l]=e.dataset.q.split('|');PL.push({id:'p'+Date.now().toString(36),label:l,months:+mo,price_sar:0,desc:''});draw()});
 m.querySelector('#pl-add').onclick=()=>{PL.push({id:'p'+Date.now().toString(36),label:'',months:12,price_sar:0,desc:''});draw()};
 m.querySelector('#pl-save').onclick=async()=>{const er=m.querySelector('#pl-err');er.textContent='';
  for(const p of PL){if(!p.label.trim()){er.textContent='اكتب اسماً لكل باقة';return}if(!(p.months>=1&&p.months<=36)||Math.round(p.months)!==p.months){er.textContent='المدة يجب أن تكون عدداً صحيحاً بين 1 و36 شهراً';return}if(!(p.price_sar>0)){er.textContent='اكتب سعراً أكبر من صفر لكل باقة';return}}
  try{await rpc('admin_set_billing',{p_plans:PL.map(p=>({id:p.id,label:p.label.trim(),months:p.months,price_sar:p.price_sar,desc:(p.desc||'').trim()||undefined})),p_enabled:m.querySelector('#pl-en').checked});toast('تم الحفظ');vBl(m)}catch(e){er.textContent=e.message}}};
 draw()}
(async()=>{const{data}=await sb.auth.getSession();if(data&&data.session){try{const w=await rpc('admin_whoami');if(w&&w.is_admin){$('me').textContent=w.email;$('login').classList.add('hide');$('app').classList.remove('hide');idle();boot()}else await sb.auth.signOut()}catch(_){await sb.auth.signOut()}}})();
</script>
